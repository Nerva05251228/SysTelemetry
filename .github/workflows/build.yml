name: Build SysTelemetry

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with built-in csc.exe
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\build.ps1
          if (-not (Test-Path .\dist\SysTelemetry.exe)) {
            throw "Build output dist\SysTelemetry.exe not found"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SysTelemetry-win-x64
          path: |
            dist/SysTelemetry.exe
            dist/LibreHardwareMonitorLib.dll
            dist/HidSharp.dll
            LICENSE
            THIRD_PARTY_NOTICES.md
